[package]
name = "auto-title"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "herdr tab titles that follow the work in each tab — deterministic, no network, no LLM."

[[bin]]
name = "auto-title"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.1"

[profile.release]
lto = true
strip = true
