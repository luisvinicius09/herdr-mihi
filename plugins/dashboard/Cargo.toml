[package]
name = "dashboard"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A non-disruptive agent-status dashboard for herdr — watch + jump, read-only."

[[bin]]
name = "dashboard"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
unicode-width = "0.1"

[profile.release]
lto = true
strip = true
