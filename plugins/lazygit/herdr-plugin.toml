id = "herdr-mihi.lazygit"
name = "lazygit"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "A git popup running your own lazygit, scoped to the current worktree."
platforms = ["macos", "linux"]

# Pure bash — no build step, no bundled binaries.

# Open lazygit the way PLACEMENT says (popup by default).
[[actions]]
id = "open"
title = "Lazygit"
command = ["sh", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/herdr/run.sh\" open"]

# Open lazygit in a side pane (split), regardless of PLACEMENT.
[[actions]]
id = "open-side"
title = "Lazygit: side pane"
command = ["sh", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/herdr/run.sh\" open-side"]

# Opt-in: add the open keybind to your herdr config.toml.
[[actions]]
id = "setup"
title = "Lazygit: add keybind"
command = ["sh", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/herdr/run.sh\" setup"]

# The popup pane (floating overlay).
[[panes]]
id = "lazygit"
title = "lazygit"
placement = "popup"
command = ["sh", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/herdr/run.sh\" pane"]

# The side pane (split beside your work).
[[panes]]
id = "lazygit-side"
title = "lazygit"
placement = "split"
command = ["sh", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/herdr/run.sh\" pane"]
